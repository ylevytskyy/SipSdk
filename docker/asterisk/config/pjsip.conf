; ==============================================================================
; PJSIP Transports
; ==============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.1/32
local_net=172.16.0.0/12
;EXTERNAL_IP_PLACEHOLDER_UDP

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=127.0.0.1/32
local_net=172.16.0.0/12
;EXTERNAL_IP_PLACEHOLDER_TCP

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; ==============================================================================
; Extension 1001: Mobile App (iOS Native SipSdk / Baresip v4)
; Standard SIP over UDP/TCP, Plain RTP, H.264 Video + Opus/PCMU/PCMA Audio
; ==============================================================================

[1001]
type=endpoint
context=default
disallow=all
allow=opus,ulaw,alaw,h264
auth=1001-auth
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
max_audio_streams=1
max_video_streams=1

[1001-auth]
type=auth
auth_type=userpass
password=test1001
username=1001

[1001]
type=aor
max_contacts=5
remove_existing=yes

; ==============================================================================
; Extension 1002: Web Test App (JsSIP WebRTC Client)
; WebRTC over WebSocket (ws://:8088/ws or wss://:8089/ws), DTLS-SRTP, ICE, H.264/VP8
; ==============================================================================

[1002]
type=endpoint
context=default
disallow=all
allow=opus,ulaw,alaw,vp8,h264
auth=1002-auth
aors=1002
direct_media=no
webrtc=yes
bundle=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=no
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
dtls_ca_file=/etc/asterisk/keys/asterisk.pem
dtls_setup=actpass
ice_support=yes
rtcp_mux=yes
media_use_received_transport=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
max_audio_streams=1
max_video_streams=1

[1002-auth]
type=auth
auth_type=userpass
password=test1002
username=1002

[1002]
type=aor
max_contacts=5
remove_existing=yes

