[modules]
autoload=yes

; Core PJSIP and media modules
preload => res_pjsip.so
preload => res_pjsip_session.so
preload => res_pjsip_sdp_rtp.so
preload => res_http_websocket.so
preload => res_pjsip_transport_websocket.so
preload => res_srtp.so

; Codecs & Formats
preload => codec_opus_open_source.so
preload => codec_ulaw.so
preload => codec_alaw.so
preload => format_h264.so
preload => res_format_attr_h264.so
preload => res_format_attr_vp8.so
preload => res_format_attr_opus.so

; Disable unused legacy modules
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_mgcp.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
