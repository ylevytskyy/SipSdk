[general]
static=yes
writeprotect=no

[default]
; ==============================================================================
; Inter-extension dialing (1001, 1002, 1003, 1004, 1005)
; Asterisk automatically bridges WebRTC (DTLS-SRTP) and native SIP (RTP) legs
; and passes through negotiated H.264 / VP8 video streams.
; ==============================================================================
exten => _1XXX,1,NoOp(PBX Call from ${CALLERID(all)} to extension ${EXTEN})
same => n,Dial(PJSIP/${EXTEN},60)
same => n,Hangup()

; ==============================================================================
; Audio + Video Echo Service: dials "echo" or "9001"
; Reflects caller's audio and video RTP streams directly back to caller.
; ==============================================================================
exten => echo,1,NoOp(Audio+Video Echo requested by ${CALLERID(all)})
same => n,Answer()
same => n,Echo()
same => n,Hangup()

exten => 9001,1,Goto(default,echo,1)

; ==============================================================================
; Music on Hold Service: dials "music" or "9002"
; ==============================================================================
exten => music,1,NoOp(Music on Hold requested by ${CALLERID(all)})
same => n,Answer()
same => n,MusicOnHold()
same => n,Hangup()

exten => 9002,1,Goto(default,music,1)

; ==============================================================================
; Delayed Callback Service: dials "9003"
; Answers, schedules an Echo call back to the caller after 2s, and hangs up.
; Used by single-process multi-call / 486 cap tests.
; ==============================================================================
exten => 9003,1,NoOp(Delayed callback requested by ${CALLERID(all)})
same => n,Set(CB_TARGET=${CALLERID(num)})
same => n,GotoIf($[${REGEX("^[0-9]{4}$" ${CB_TARGET})} = 0]?done)
same => n,System(/usr/local/bin/pbx-callback.sh ${CB_TARGET} >/dev/null 2>&1 </dev/null &)
same => n,Answer()
same => n,Wait(1)
same => n(done),Hangup()

[messages]
; ==============================================================================
; SIP MESSAGE (RFC 3428) routing between extensions (1001, 1002, 1003, 1004, 1005).
; Endpoints set message_context=messages in pjsip.conf. A sender may also message
; its own extension, which the SDK tests use as a loopback.
; The message is forked to every registered contact of the target, so each device
; of a user gets it (and a stale contact does not swallow it).
; ==============================================================================
; The forwarded From is rebuilt from the sender's URI. A sender could otherwise forge
; the display name (or put a comma in it), because MESSAGE(from) is whatever the sender
; wrote. Asterisk only identifies an endpoint whose name is the From user and checks the
; digest for it, so that user is the authenticated extension. The Authorization header
; must name the same user: username= may be any parameter (Asterisk re-serialises the
; header with username first, but the scheme keeps the sender's case). Asterisk does
; not expose the endpoint name to the message dialplan (MESSAGE_DATA(PJSIP_ENDPOINT) and CHANNEL(endpoint) are empty).
exten => _1XXX,1,NoOp(SIP MESSAGE to ${EXTEN})
same => n,Set(MSGFROM=${MESSAGE(from)})
same => n,Set(FROMURI=${CUT(CUT(MSGFROM,<,${FIELDQTY(MSGFROM,<)}),>,1)})
same => n,Set(FROMUSER=${CUT(CUT(FROMURI,:,2),@,1)})
same => n,Set(AUTHHDR=${MESSAGE_DATA(Authorization)})
same => n,GotoIf($[${REGEX("^sips?:[0-9A-Za-z_.-]+@[0-9A-Za-z_.:-]+$" ${FROMURI})} = 0]?rejected)
same => n,GotoIf($[${REGEX("^[Dd][Ii][Gg][Ee][Ss][Tt] +([A-Za-z]+=(\"[^\"]*\"|[^,\" ]*) *, *)*username=\"${FROMUSER}\" *(,|$)" ${AUTHHDR})} = 0]?rejected)
same => n,Set(SENDER=<${FROMURI}>)
same => n,Set(CONTACTS=${PJSIP_AOR(${EXTEN},contact)})
same => n,GotoIf($["${CONTACTS}" = ""]?done)
same => n,While($["${SET(CONTACT=${SHIFT(CONTACTS)})}" != ""])
same => n,MessageSend("pjsip:${EXTEN}/${PJSIP_CONTACT(${CONTACT},uri)}","${SENDER}")
same => n,NoOp(MessageSend to ${CONTACT}: ${MESSAGE_SEND_STATUS})
same => n,EndWhile()
same => n(done),Hangup()
same => n(rejected),Log(WARNING,SIP MESSAGE dropped: sender URI or credentials do not match)
same => n,Hangup()
