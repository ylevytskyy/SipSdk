[general]
static=yes
writeprotect=no

[default]
; ==============================================================================
; Inter-extension dialing (1001, 1002, 1003, 1004, 1005)
; Asterisk automatically bridges WebRTC (DTLS-SRTP) and native SIP (RTP) legs
; and passes through negotiated H.264 / VP8 video streams.
; ==============================================================================
exten => _1XXX,1,NoOp(PBX Call from ${CALLERID(all)} to extension ${EXTEN})
same => n,Dial(PJSIP/${EXTEN},60)
same => n,Hangup()

; ==============================================================================
; Audio + Video Echo Service: dials "echo" or "9001"
; Reflects caller's audio and video RTP streams directly back to caller.
; ==============================================================================
exten => echo,1,NoOp(Audio+Video Echo requested by ${CALLERID(all)})
same => n,Answer()
same => n,Echo()
same => n,Hangup()

exten => 9001,1,Goto(default,echo,1)

; ==============================================================================
; Music on Hold Service: dials "music" or "9002"
; ==============================================================================
exten => music,1,NoOp(Music on Hold requested by ${CALLERID(all)})
same => n,Answer()
same => n,MusicOnHold()
same => n,Hangup()

exten => 9002,1,Goto(default,music,1)
