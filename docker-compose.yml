services:
  asterisk:
    build:
      context: ./docker/asterisk
      dockerfile: Dockerfile
    image: sipsdk-asterisk:latest
    container_name: sipsdk-asterisk
    restart: unless-stopped
    environment:
      - EXTERNAL_IP=${EXTERNAL_IP:-127.0.0.1}
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088/tcp"
      - "8089:8089/tcp"
      - "10000-10099:10000-10099/udp"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 5s
      timeout: 3s
      retries: 5
