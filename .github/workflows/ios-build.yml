name: iOS Build

on:
  push:
    branches:
      - master
      - "maintenance/**"
    paths:
      - "platforms/ios/**"
      - "core/**"
      - "Package.swift"
      - "scripts/verify-spm-video-sdk.sh"
      - "scripts/verify-xcode-app-build.sh"
      - "scripts/verify-ios-video-tests.sh"
  pull_request:
    branches:
      - master
    paths:
      - "platforms/ios/**"
      - "core/**"
      - "Package.swift"
      - "scripts/verify-spm-video-sdk.sh"
      - "scripts/verify-xcode-app-build.sh"
      - "scripts/verify-ios-video-tests.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify iOS SDK and Sample App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify SwiftPM SDK across architectures
        run: bash scripts/verify-spm-video-sdk.sh

      - name: Verify SipPhone Sample App build
        run: bash scripts/verify-xcode-app-build.sh
