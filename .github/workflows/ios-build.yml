name: iOS Build

on:
  push:
    branches:
      - master
      - "maintenance/**"
    paths:
      - "Package.swift"
      - "Sources/SipSdk/**"
      - "Sources/SipSdkResources/**"
      - "TareSIPDemo/**"
      - "TareSIPDemo.xcodeproj/**"
      - "TareSIPDemo.xcworkspace/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches:
      - master
    paths:
      - "Package.swift"
      - "Sources/SipSdk/**"
      - "Sources/SipSdkResources/**"
      - "TareSIPDemo/**"
      - "TareSIPDemo.xcodeproj/**"
      - "TareSIPDemo.xcworkspace/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TareSIPDemo with SwiftPM
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Validate package manifest
        run: swift package dump-package

      - name: Resolve local SwiftPM package and binary XCFramework
        run: xcodebuild -resolvePackageDependencies -project TareSIPDemo.xcodeproj -scheme TareSIPDemo

      - name: List project schemes
        run: xcodebuild -list -project TareSIPDemo.xcodeproj

      - name: Build for iOS Simulator (arm64)
        run: >-
          xcodebuild
          -project TareSIPDemo.xcodeproj
          -scheme TareSIPDemo
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build for iOS Simulator (x86_64)
        run: >-
          xcodebuild
          -project TareSIPDemo.xcodeproj
          -scheme TareSIPDemo
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=x86_64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build for iOS device (arm64)
        run: >-
          xcodebuild
          -project TareSIPDemo.xcodeproj
          -scheme TareSIPDemo
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
