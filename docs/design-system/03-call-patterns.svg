<g font-size="15" fill="#526079">
<text x="486" y="701">Hold → Show “On hold” and a “Resume” action.</text>
<text x="486" y="730">Network lost → Show “Connection lost”. Keep “End call” available.</text>
<text x="486" y="759">Camera unavailable → Explain why and continue with audio.</text>
<text x="486" y="788">Use a solid control panel so controls stay clear over any video.</text>
